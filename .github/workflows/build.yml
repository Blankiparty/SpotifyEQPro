name: Build SpotifyEQPro jailed

on:
  workflow_dispatch:
  push:
    paths:
      - "Tweak.m"
      - "EQPAudio.h"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real Apple AudioUnit
        run: |
          mkdir -p output
          xcrun clang -fobjc-arc -O2 scripts/test_audio.m -framework Foundation -framework AudioToolbox -o output/test_audio
          output/test_audio
      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
      - name: Build jailed library
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu) FINALPACKAGE=1
          DYLIB="$(find .theos/obj -name 'SpotifyEQPro.dylib' -type f | head -1)"
          test -n "$DYLIB"
          cp "$DYLIB" output/SpotifyEQPro.dylib
          install_name_tool -id @rpath/SpotifyEQPro.dylib output/SpotifyEQPro.dylib
          codesign --force --sign - output/SpotifyEQPro.dylib
          file output/SpotifyEQPro.dylib
          otool -L output/SpotifyEQPro.dylib | tee output/dependencies.txt
          if grep -Ei 'substrate|substitute|libhooker|/var/jb|/Library/Frameworks' output/dependencies.txt; then
            echo "Jailbreak dependency found" >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > output/commit.txt
      - name: Upload tested library
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyEQPro-${{ github.sha }}
          path: |
            output/SpotifyEQPro.dylib
            output/dependencies.txt
            output/commit.txt
          if-no-files-found: error
